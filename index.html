<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣四大零售集團深度分析</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide Icons 用於圖示 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            scroll-behavior: smooth;
            background-color: #f8fafc;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gradient-text {
            background: linear-gradient(90deg, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-zoom:hover img {
            transform: scale(1.05);
        }

        .section-icon {
            @apply w-10 h-10 rounded-lg flex items-center justify-center mb-4;
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- 主選單 / 首頁 -->
    <div id="home" class="page active">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <nav class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="showPage('home')">
                    <div class="bg-indigo-600 p-2 rounded-lg">
                        <i data-lucide="shopping-cart" class="text-white w-5 h-5"></i>
                    </div>
                    <span class="text-xl font-black tracking-tight text-indigo-900">RETAIL TAIWAN</span>
                </div>
                <div class="hidden md:flex gap-6 text-sm font-semibold text-slate-600">
                    <a href="#" onclick="showPage('carrefour')" class="hover:text-red-600 transition">家樂福</a>
                    <a href="#" onclick="showPage('costco')" class="hover:text-blue-600 transition">好市多</a>
                    <a href="#" onclick="showPage('pxmart')" class="hover:text-emerald-600 transition">全聯</a>
                    <a href="#" onclick="showPage('amart')" class="hover:text-purple-600 transition">愛買</a>
                </div>
            </nav>
        </header>

        <section class="max-w-7xl mx-auto px-4 py-12">
            <div class="text-center mb-16">
                <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight">
                    探索台灣零售<br><span class="gradient-text">四大巨頭的成功之道</span>
                </h1>
                <p class="text-xl text-slate-500 max-w-2xl mx-auto">
                    從全球量販到社區超市，深入解析引領台灣消費市場的四大企業核心戰略與未來願景。
                </p>
            </div>

            <!-- 企業卡片導覽 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- 家樂福 -->
                <div onclick="showPage('carrefour')" class="group cursor-pointer bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 overflow-hidden card-zoom">
                    <div class="h-48 overflow-hidden">
                        <img src="002.png" alt="家樂福" class="w-full h-full object-cover transition duration-500">
                    </div>
                    <div class="p-6 border-t-4 border-red-500">
                        <h2 class="text-2xl font-bold mb-2 group-hover:text-red-600 transition">家樂福 Carrefour</h2>
                        <p class="text-sm text-slate-500 line-clamp-2">全通路零售領航者，量販與超市的最佳結合。</p>
                        <div class="mt-4 flex items-center text-red-600 font-bold text-sm">
                            了解詳情 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                        </div>
                    </div>
                </div>

                <!-- 好市多 -->
                <div onclick="showPage('costco')" class="group cursor-pointer bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 overflow-hidden card-zoom">
                    <div class="h-48 overflow-hidden">
                        <img src="001.png" alt="好市多" class="w-full h-full object-cover transition duration-500">
                    </div>
                    <div class="p-6 border-t-4 border-blue-700">
                        <h2 class="text-2xl font-bold mb-2 group-hover:text-blue-700 transition">好市多 Costco</h2>
                        <p class="text-sm text-slate-500 line-clamp-2">美式會員制倉儲，極致品質與大包裝的代名詞。</p>
                        <div class="mt-4 flex items-center text-blue-700 font-bold text-sm">
                            了解詳情 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                        </div>
                    </div>
                </div>

                <!-- 全聯 -->
                <div onclick="showPage('pxmart')" class="group cursor-pointer bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 overflow-hidden card-zoom">
                    <div class="h-48 overflow-hidden">
                        <img src="003.png" alt="全聯" class="w-full h-full object-cover transition duration-500">
                    </div>
                    <div class="p-6 border-t-4 border-emerald-600">
                        <h2 class="text-2xl font-bold mb-2 group-hover:text-emerald-600 transition">全聯 PX Mart</h2>
                        <p class="text-sm text-slate-500 line-clamp-2">深入社區的民生守護者，數位與實體的完美滲透。</p>
                        <div class="mt-4 flex items-center text-emerald-600 font-bold text-sm">
                            了解詳情 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                        </div>
                    </div>
                </div>

                <!-- 愛買 -->
                <div onclick="showPage('amart')" class="group cursor-pointer bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 overflow-hidden card-zoom">
                    <div class="h-48 overflow-hidden">
                        <img src="004.png" alt="愛買" class="w-full h-full object-cover transition duration-500">
                    </div>
                    <div class="p-6 border-t-4 border-purple-600">
                        <h2 class="text-2xl font-bold mb-2 group-hover:text-purple-600 transition">愛買 A-Mart</h2>
                        <p class="text-sm text-slate-500 line-clamp-2">遠東集團核心成員，在地化經營與精緻生活的橋樑。</p>
                        <div class="mt-4 flex items-center text-purple-600 font-bold text-sm">
                            了解詳情 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 企業分頁 Template -->
    <div id="detail-page" class="page">
        <nav class="bg-white border-b sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <button onclick="showPage('home')" class="flex items-center gap-2 text-slate-600 hover:text-indigo-600 transition font-bold">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i> 返回首頁
                </button>
                <div id="detail-nav-title" class="font-black text-xl"></div>
            </div>
        </nav>

        <div id="detail-content" class="max-w-5xl mx-auto px-4 py-12">
            <!-- 內容將由 JS 動態填充 -->
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-400 py-12 mt-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-sm">© 2025 台灣零售產業深度研究報告</p>
        </div>
    </footer>

    <script>
        // 企業詳細數據
        const companies = {
            carrefour: {
                name: '家樂福 Carrefour',
                color: 'red',
                img: 'http://googleusercontent.com/image_generation_content/1',
                spirit: '「顧客至上，熱愛食物」— 致力於提供高品質的商品，讓每個人都能負擔得起健康與永續的生活。',
                methods: [
                    '全通路策略：結合大型量販、便利購超市與電商 App，實現無縫購物體驗。',
                    '在地採購：與台灣小農合作，推廣友善農法商品，縮短碳足跡。',
                    '數位轉型：領先業界導入自動化物流中心與 AI 補貨系統。'
                ],
                future: '目標成為全球數位領先零售商，擴大無人商店實驗，並深化個人化數據行銷。',
                sustainability: '「食物轉型計畫」：推動非籠飼雞蛋、減塑包裝，目標在 2030 年減少 50% 的食物浪費。'
            },
            costco: {
                name: '好市多 Costco',
                color: 'blue',
                img: 'http://googleusercontent.com/image_generation_content/0',
                spirit: '「以最合適的價格提供高品質商品」— 透過會員制度，將節省下來的成本直接回饋給消費者。',
                methods: [
                    '會員制經營：年費收入支撐低毛利策略，鎖定高忠誠度消費群。',
                    '大包裝模式：減少包裝耗材與物流頻率，提升營運效率。',
                    'SKU 精簡化：精選熱門商品，確保每一項商品都具備極高市場競爭力。'
                ],
                future: '持續優化線上購物體驗，並在台灣尋找更多開設實體加油站與新據點的機會，強化一站式體驗。',
                sustainability: '推行「資源節約」計畫，提升全球物流中心的太陽能發電比例，並嚴格管控供應鏈的人權與環境標準。'
            },
            pxmart: {
                name: '全聯福利中心 PX Mart',
                color: 'emerald',
                img: 'http://googleusercontent.com/image_generation_content/2',
                spirit: '「實在真便宜」— 提供便利、品質優良且價格實惠的民生必需品，成為鄰里的好鄰居。',
                methods: [
                    '高滲透率佈點：採取「一里一全聯」策略，深入住宅區。',
                    'PX Pay 生態系：透過行動支付整合會員點數，掌握千萬級數據流量。',
                    '冷鏈優勢：投資上百億建立自動化生鮮處理中心，確保農場到餐桌的新鮮。'
                ],
                future: '整合大潤發後，將發展「超市+量販」雙引擎模式，並開發更多自有品牌 (OFF COFFEE、We Sweet)。',
                sustainability: '「惜食計畫」：將即期商品捐贈給弱勢團體。並推動「循環杯」與「減塑門市」試點。'
            },
            amart: {
                name: '愛買 A-Mart',
                color: 'purple',
                img: 'http://googleusercontent.com/image_generation_content/3',
                spirit: '「為台灣家庭創造精緻生活」— 結合遠東集團資源，提供優質的購物環境與貼心的服務。',
                methods: [
                    '都會生活圈：選址多位於都會樞紐，結合購物中心形成複合式商場。',
                    '集團資源綜效：結合 HAPPY GO 點數與遠東銀行金融服務，打造跨產業會員生態。',
                    '嚴選商品：特別強化生鮮與家電領域的專業導購。'
                ],
                future: '發展「智能量販店」，導入自助結帳與電子標籤，提升服務品質並優化人力配置。',
                sustainability: '配合遠東集團 CSR 策略，推動太陽能電站安裝、節能空調更新，並定期舉辦公益捐贈活動。'
            }
        };

        function showPage(pageId) {
            // 隱藏所有頁面
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            if (pageId === 'home') {
                document.getElementById('home').classList.add('active');
                window.scrollTo(0, 0);
            } else {
                const data = companies[pageId];
                const detailPage = document.getElementById('detail-page');
                const content = document.getElementById('detail-content');
                const navTitle = document.getElementById('detail-nav-title');

                navTitle.innerText = data.name;
                navTitle.style.color = data.color === 'emerald' ? '#059669' : 
                                       data.color === 'blue' ? '#1d4ed8' : 
                                       data.color === 'red' ? '#dc2626' : '#9333ea';

                content.innerHTML = `
                    <div class="mb-12 rounded-3xl overflow-hidden shadow-2xl h-[400px]">
                        <img src="${data.img}" class="w-full h-full object-cover">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                        <!-- 核心精神 -->
                        <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                            <div class="section-icon bg-${data.color}-100">
                                <i data-lucide="heart" class="text-${data.color}-600"></i>
                            </div>
                            <h3 class="text-2xl font-bold mb-4">核心精神</h3>
                            <p class="text-slate-600 leading-relaxed text-lg">${data.spirit}</p>
                        </div>

                        <!-- 經營方法 -->
                        <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                            <div class="section-icon bg-${data.color}-100">
                                <i data-lucide="settings" class="text-${data.color}-600"></i>
                            </div>
                            <h3 class="text-2xl font-bold mb-4">經營方法</h3>
                            <ul class="space-y-4">
                                ${data.methods.map(m => `
                                    <li class="flex items-start gap-3 text-slate-600">
                                        <i data-lucide="check-circle" class="text-${data.color}-500 w-5 h-5 mt-1 shrink-0"></i>
                                        <span>${m}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- 未來展望 -->
                        <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                            <div class="section-icon bg-${data.color}-100">
                                <i data-lucide="trending-up" class="text-${data.color}-600"></i>
                            </div>
                            <h3 class="text-2xl font-bold mb-4">未來展望</h3>
                            <p class="text-slate-600 leading-relaxed text-lg">${data.future}</p>
                        </div>

                        <!-- 永續方式 -->
                        <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                            <div class="section-icon bg-${data.color}-100">
                                <i data-lucide="leaf" class="text-${data.color}-600"></i>
                            </div>
                            <h3 class="text-2xl font-bold mb-4">永續方式</h3>
                            <p class="text-slate-600 leading-relaxed text-lg font-semibold border-l-4 border-${data.color}-500 pl-4">
                                ${data.sustainability}
                            </p>
                        </div>
                    </div>

                    <div class="mt-16 text-center">
                        <button onclick="showPage('home')" class="bg-slate-900 text-white px-8 py-3 rounded-full hover:bg-slate-800 transition font-bold shadow-lg">
                            返回首頁
                        </button>
                    </div>
                `;

                detailPage.classList.add('active');
                lucide.createIcons(); // 重新渲染圖示
                window.scrollTo(0, 0);
            }
        }

        // 初始化圖示
        window.onload = () => {
            lucide.createIcons();
        };
    </script>
</body>
</html>
